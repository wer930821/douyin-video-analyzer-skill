[project]
name = "douyin-video-analyzer-skill"
version = "0.3.0"
description = "Prepare mainland China Douyin video media for direct analysis by an MCP client"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "mcp>=2.0,<3",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
